<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
<title id="t">DSQL への接続の試行回数</title><desc id="d">Event は、環境ごとに 1 本の接続を張るので、試行回数は環境数と同じ程度になる。Web は、ケース A では少ないが、急なスパイクのケース C では Event より多い。</desc>
<style>
  svg { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .bg { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .grid { stroke: #e6e5e1; stroke-width: 1; } .axis { stroke: #c9c8c3; stroke-width: 1; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; } .s4 { fill: #eda100; } .s5 { fill: #e87ba4; } .onfill { fill: #0b0b0b; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .grid { stroke: #2e2e2c; } .axis { stroke: #4a4a46; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; } .s4 { fill: #c98500; } .s5 { fill: #d55181; }
  }
</style>
<rect class="bg" width="720" height="400"/>
<line class="grid" x1="64" x2="696" y1="322" y2="322"/><text x="56" y="326" class="ink2" font-size="11" text-anchor="end" font-weight="400">0</text><line class="grid" x1="64" x2="696" y1="236" y2="236"/><text x="56" y="240" class="ink2" font-size="11" text-anchor="end" font-weight="400">300</text><line class="grid" x1="64" x2="696" y1="150" y2="150"/><text x="56" y="154" class="ink2" font-size="11" text-anchor="end" font-weight="400">600</text><line class="grid" x1="64" x2="696" y1="64" y2="64"/><text x="56" y="68" class="ink2" font-size="11" text-anchor="end" font-weight="400">900</text><line class="axis" x1="64" x2="696" y1="322" y2="322"/><text x="64" y="22" class="ink2" font-size="12" text-anchor="start" font-weight="400">1 回の実行（1 構成・1 セット）あたりの接続の試行回数</text><rect class="s1" x="64" y="34" width="10" height="10" rx="2"/><text x="80" y="43" class="ink" font-size="12" text-anchor="start" font-weight="400">Event</text><rect class="s2" x="169" y="34" width="10" height="10" rx="2"/><text x="185" y="43" class="ink" font-size="12" text-anchor="start" font-weight="400">Web（プール 10）</text><rect class="s3" x="352" y="34" width="10" height="10" rx="2"/><text x="368" y="43" class="ink" font-size="12" text-anchor="start" font-weight="400">Web（プール 64）</text><path class="s1" d="M115,322 L115,251.2 A4,4 0 0 1 119,247.2 L135,247.2 A4,4 0 0 1 139,251.2 L139,322 Z"/><text x="127" y="241.2" class="ink" font-size="11" text-anchor="middle" font-weight="600">261</text><path class="s2" d="M147,322 L147,309.4 A4,4 0 0 1 151,305.4 L167,305.4 A4,4 0 0 1 171,309.4 L171,322 Z"/><text x="159" y="299.4" class="ink" font-size="11" text-anchor="middle" font-weight="600">58</text><text x="143" y="342" class="ink2" font-size="12" text-anchor="middle" font-weight="400">A 外部 I/O</text><path class="s1" d="M273,322 L273,314.6 A4,4 0 0 1 277,310.6 L293,310.6 A4,4 0 0 1 297,314.6 L297,322 Z"/><text x="285" y="304.6" class="ink" font-size="11" text-anchor="middle" font-weight="600">40</text><path class="s2" d="M305,322 L305,311.2 A4,4 0 0 1 309,307.2 L325,307.2 A4,4 0 0 1 329,311.2 L329,322 Z"/><text x="317" y="301.2" class="ink" font-size="11" text-anchor="middle" font-weight="600">52</text><text x="301" y="342" class="ink2" font-size="12" text-anchor="middle" font-weight="400">B 混在</text><path class="s1" d="M431,322 L431,252.2 A4,4 0 0 1 435,248.2 L451,248.2 A4,4 0 0 1 455,252.2 L455,322 Z"/><text x="443" y="242.2" class="ink" font-size="11" text-anchor="middle" font-weight="600">257</text><path class="s2" d="M463,322 L463,127.8 A4,4 0 0 1 467,123.8 L483,123.8 A4,4 0 0 1 487,127.8 L487,322 Z"/><text x="475" y="117.8" class="ink" font-size="11" text-anchor="middle" font-weight="600">692</text><text x="459" y="342" class="ink2" font-size="12" text-anchor="middle" font-weight="400">C 急なスパイク</text><path class="s1" d="M573,322 L573,287.7 A4,4 0 0 1 577,283.7 L593,283.7 A4,4 0 0 1 597,287.7 L597,322 Z"/><text x="585" y="277.7" class="ink" font-size="11" text-anchor="middle" font-weight="600">134</text><path class="s2" d="M605,322 L605,305.2 A4,4 0 0 1 609,301.2 L625,301.2 A4,4 0 0 1 629,305.2 L629,322 Z"/><text x="617" y="295.2" class="ink" font-size="11" text-anchor="middle" font-weight="600">73</text><path class="s3" d="M637,322 L637,263.7 A4,4 0 0 1 641,259.7 L657,259.7 A4,4 0 0 1 661,263.7 L661,322 Z"/><text x="649" y="253.7" class="ink" font-size="11" text-anchor="middle" font-weight="600">218</text><text x="617" y="342" class="ink2" font-size="12" text-anchor="middle" font-weight="400">D 重い集計</text><text x="64" y="390" class="ink2" font-size="11" text-anchor="start" font-weight="400">2 セットの平均。A は無効にした 400 RPS の段の途中まで、C の Event は生成側の上限で頭打ちの下限値。</text>
</svg>
