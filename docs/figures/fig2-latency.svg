<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
<title id="t">軽い読み取りの応答時間の内訳</title><desc id="d">同じ読み取りで、Web は Event より約 7 ms 短い。DB とアプリ内の時間は同じで、差はすべて経路の時間にある。</desc>
<style>
  svg { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .bg { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .grid { stroke: #e6e5e1; stroke-width: 1; } .axis { stroke: #c9c8c3; stroke-width: 1; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; } .s4 { fill: #eda100; } .s5 { fill: #e87ba4; } .onfill { fill: #0b0b0b; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .grid { stroke: #2e2e2c; } .axis { stroke: #4a4a46; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; } .s4 { fill: #c98500; } .s5 { fill: #d55181; }
  }
</style>
<rect class="bg" width="720" height="400"/>
<line class="grid" x1="64" x2="696" y1="322" y2="322"/><text x="56" y="326" class="ink2" font-size="11" text-anchor="end" font-weight="400">0</text><line class="grid" x1="64" x2="696" y1="236" y2="236"/><text x="56" y="240" class="ink2" font-size="11" text-anchor="end" font-weight="400">6</text><line class="grid" x1="64" x2="696" y1="150" y2="150"/><text x="56" y="154" class="ink2" font-size="11" text-anchor="end" font-weight="400">12</text><line class="grid" x1="64" x2="696" y1="64" y2="64"/><text x="56" y="68" class="ink2" font-size="11" text-anchor="end" font-weight="400">18</text><line class="axis" x1="64" x2="696" y1="322" y2="322"/><text x="64" y="22" class="ink2" font-size="12" text-anchor="start" font-weight="400">応答時間の中央値（ms）の内訳</text><rect class="s3" x="64" y="34" width="10" height="10" rx="2"/><text x="80" y="43" class="ink" font-size="12" text-anchor="start" font-weight="400">経路の時間</text><rect class="s4" x="169" y="34" width="10" height="10" rx="2"/><text x="185" y="43" class="ink" font-size="12" text-anchor="start" font-weight="400">アプリ内（DB 以外）</text><rect class="s5" x="352" y="34" width="10" height="10" rx="2"/><text x="368" y="43" class="ink" font-size="12" text-anchor="start" font-weight="400">DB</text><rect class="s5" x="186" y="285.3" width="72" height="36.7"/><text x="222" y="307.7" class="onfill" font-size="12" text-anchor="middle" font-weight="600">2.7</text><path class="s3" d="M186,281.9 L186,119.5 A4,4 0 0 1 190,115.5 L254,115.5 A4,4 0 0 1 258,119.5 L258,281.9 Z"/><text x="222" y="202.7" class="onfill" font-size="12" text-anchor="middle" font-weight="600">11.8</text><text x="222" y="107.5" class="ink" font-size="11" text-anchor="middle" font-weight="600">14.6</text><text x="222" y="342" class="ink2" font-size="12" text-anchor="middle" font-weight="400">Event</text><rect class="s5" x="502" y="286.7" width="72" height="35.3"/><text x="538" y="308.4" class="onfill" font-size="12" text-anchor="middle" font-weight="600">2.6</text><path class="s3" d="M502,283.3 L502,222.7 A4,4 0 0 1 506,218.7 L570,218.7 A4,4 0 0 1 574,222.7 L574,283.3 Z"/><text x="538" y="255" class="onfill" font-size="12" text-anchor="middle" font-weight="600">4.7</text><text x="538" y="210.7" class="ink" font-size="11" text-anchor="middle" font-weight="600">7.4</text><text x="538" y="342" class="ink2" font-size="12" text-anchor="middle" font-weight="400">Web</text><text x="64" y="390" class="ink2" font-size="11" text-anchor="start" font-weight="400">ケース B の item（400 RPS）、2 セットの平均。合計は各部分の中央値の和で、全体の中央値とは少し違う。</text>
