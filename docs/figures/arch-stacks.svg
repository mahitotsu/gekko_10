<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" width="720" height="262" role="img" aria-labelledby="t d">
<title id="t">スタックの依存</title><desc id="d">Event と Web のスタックは、Db スタックの出力を参照する。Load スタックは他に依存しない。</desc>
<style>
  svg { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .bg { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; }
  .box { fill: #ffffff; stroke: #c9c8c3; stroke-width: 1; } .grp { fill: #f4f3f0; stroke: #e6e5e1; stroke-width: 1; }
  .ev { fill: #e8f0fb; stroke: #2a78d6; stroke-width: 1.5; } .wb { fill: #fdeee7; stroke: #eb6834; stroke-width: 1.5; }
  .line { stroke: #52514e; stroke-width: 1.5; fill: none; } .dash { stroke: #9a9992; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
  .head { fill: #52514e; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
    .box { fill: #242422; stroke: #4a4a46; } .grp { fill: #20201f; stroke: #2e2e2c; }
    .ev { fill: #17263a; stroke: #3987e5; } .wb { fill: #3a2218; stroke: #d95926; }
    .line { stroke: #c3c2b7; } .dash { stroke: #7a7972; } .head { fill: #c3c2b7; }
  }
</style>
<rect class="bg" width="720" height="262"/>
<rect class="box" x="24" y="84" width="176" height="64" rx="6"/><text x="112" y="112" class="ink" font-size="12" text-anchor="middle" font-weight="600">Gekko10DbStack</text><text x="112" y="128" class="ink2" font-size="11" text-anchor="middle" font-weight="400">DSQL クラスタ（状態を持つ）</text><rect class="ev" x="320" y="24" width="176" height="64" rx="6"/><text x="408" y="52" class="ink" font-size="12" text-anchor="middle" font-weight="600">Gekko10EventStack</text><text x="408" y="68" class="ink2" font-size="11" text-anchor="middle" font-weight="400">Event の全関数</text><rect class="wb" x="320" y="144" width="176" height="64" rx="6"/><text x="408" y="172" class="ink" font-size="12" text-anchor="middle" font-weight="600">Gekko10WebStack</text><text x="408" y="188" class="ink2" font-size="11" text-anchor="middle" font-weight="400">Web の全関数</text><rect class="box" x="540" y="84" width="160" height="64" rx="6"/><text x="620" y="112" class="ink" font-size="12" text-anchor="middle" font-weight="600">Gekko10LoadStack</text><text x="620" y="128" class="ink2" font-size="11" text-anchor="middle" font-weight="400">Fargate タスク定義</text><polyline class="line" points="200,106 260,106 260,56 320,56"/><polygon class="head" points="320,56 312.6,52.9 312.6,59.1"/><polyline class="line" points="200,126 260,126 260,176 320,176"/><polygon class="head" points="320,176 312.6,172.9 312.6,179.1"/><text x="262" y="20" class="ink2" font-size="11" text-anchor="end" font-weight="400">出力（エンドポイントと ARN）を渡す</text><text x="24" y="246" class="ink2" font-size="11" text-anchor="start" font-weight="400">矢印は、出力を渡す向き（Event と Web が参照する）。Load は他に依存しない。デプロイは Db → Event/Web、削除は Event/Web → Db の順。</text>
</svg>
