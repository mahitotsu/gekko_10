<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" role="img" aria-labelledby="t d">
<title id="t">測定の進行</title><desc id="d">ローカルで計画を作ってタスクを起動すると、以後は Fargate タスクが最後まで進める。終了後にローカルがログを回収する。</desc>
<style>
  svg { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .bg { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; }
  .box { fill: #ffffff; stroke: #c9c8c3; stroke-width: 1; } .grp { fill: #f4f3f0; stroke: #e6e5e1; stroke-width: 1; }
  .ev { fill: #e8f0fb; stroke: #2a78d6; stroke-width: 1.5; } .wb { fill: #fdeee7; stroke: #eb6834; stroke-width: 1.5; }
  .line { stroke: #52514e; stroke-width: 1.5; fill: none; } .dash { stroke: #9a9992; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
  .head { fill: #52514e; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
    .box { fill: #242422; stroke: #4a4a46; } .grp { fill: #20201f; stroke: #2e2e2c; }
    .ev { fill: #17263a; stroke: #3987e5; } .wb { fill: #3a2218; stroke: #d95926; }
    .line { stroke: #c3c2b7; } .dash { stroke: #7a7972; } .head { fill: #c3c2b7; }
  }
</style>
<rect class="bg" width="720" height="392"/>
<rect class="box" x="20" y="20" width="160" height="40" rx="6"/><text x="100" y="44" class="ink" font-size="12" text-anchor="middle" font-weight="600">ローカル PC</text><line class="dash" x1="100" y1="72" x2="100" y2="380"/><rect class="box" x="280" y="20" width="160" height="40" rx="6"/><text x="360" y="36" class="ink" font-size="12" text-anchor="middle" font-weight="600">Fargate タスク</text><text x="360" y="52" class="ink2" font-size="11" text-anchor="middle" font-weight="400">（suite-runner / suite-post）</text><line class="dash" x1="360" y1="72" x2="360" y2="380"/><rect class="box" x="540" y="20" width="160" height="40" rx="6"/><text x="620" y="36" class="ink" font-size="12" text-anchor="middle" font-weight="600">AWS</text><text x="620" y="52" class="ink2" font-size="11" text-anchor="middle" font-weight="400">（関数・DSQL・CloudWatch）</text><line class="dash" x1="620" y1="72" x2="620" y2="380"/><rect class="grp" x="248" y="164" width="400" height="76" rx="6" fill-opacity="0.5"/><text x="256" y="180" class="ink2" font-size="11" text-anchor="start" font-weight="600">計画の回ごとに繰り返す</text><text x="110" y="104" class="ink" font-size="12" text-anchor="start" font-weight="400">suite-start：計画を作り、版と条件を確かめる</text><circle class="head" cx="100" cy="100" r="3"/><polyline class="line" points="100,140 360,140"/><polygon class="head" points="360,140 352.6,136.9 352.6,143.1"/><text x="230" y="132" class="ink" font-size="12" text-anchor="middle" font-weight="400">タスクを起動（ここで PC を閉じてよい）</text><text x="370" y="194" class="ink" font-size="12" text-anchor="start" font-weight="400">suite-runner：計画の時刻まで待つ</text><circle class="head" cx="360" cy="190" r="3"/><polyline class="line" points="360,220 620,220"/><polygon class="head" points="620,220 612.6,216.9 612.6,223.1"/><text x="490" y="212" class="ink" font-size="12" text-anchor="middle" font-weight="400">invoke.ts：段を上げて負荷をかける</text><polyline class="line" points="360,270 620,270"/><polygon class="head" points="620,270 612.6,266.9 612.6,273.1"/><text x="490" y="262" class="ink" font-size="12" text-anchor="middle" font-weight="400">suite-post：メトリクスと REPORT を集める</text><text x="370" y="314" class="ink" font-size="12" text-anchor="start" font-weight="400">分析して合否を判定（SUITE_VERDICT）</text><circle class="head" cx="360" cy="310" r="3"/><polyline class="dash" points="100,360 360,360"/><polygon class="head" points="360,360 352.6,356.9 352.6,363.1"/><text x="230" y="352" class="ink" font-size="12" text-anchor="middle" font-weight="400">suite-fetch：ログを読み、回ごとのファイルに分ける</text>
</svg>
