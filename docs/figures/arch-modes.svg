<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" width="720" height="316" role="img" aria-labelledby="t d">
<title id="t">接続の持ち方 3 モード</title><desc id="d">each は毎回接続し、reuse は環境で 1 接続を使い回し、pool は環境のプールを借りて返す。</desc>
<style>
  svg { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .bg { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; }
  .box { fill: #ffffff; stroke: #c9c8c3; stroke-width: 1; } .grp { fill: #f4f3f0; stroke: #e6e5e1; stroke-width: 1; }
  .ev { fill: #e8f0fb; stroke: #2a78d6; stroke-width: 1.5; } .wb { fill: #fdeee7; stroke: #eb6834; stroke-width: 1.5; }
  .line { stroke: #52514e; stroke-width: 1.5; fill: none; } .dash { stroke: #9a9992; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
  .head { fill: #52514e; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
    .box { fill: #242422; stroke: #4a4a46; } .grp { fill: #20201f; stroke: #2e2e2c; }
    .ev { fill: #17263a; stroke: #3987e5; } .wb { fill: #3a2218; stroke: #d95926; }
    .line { stroke: #c3c2b7; } .dash { stroke: #7a7972; } .head { fill: #c3c2b7; }
  }
</style>
<rect class="bg" width="720" height="316"/>
<text x="16" y="42" class="ink" font-size="13" text-anchor="start" font-weight="600">each</text><text x="16" y="60" class="ink2" font-size="11" text-anchor="start" font-weight="400">Event / Web</text><rect class="box" x="112" y="20" width="116" height="52" rx="6"/><text x="170" y="50" class="ink" font-size="12" text-anchor="middle" font-weight="600">リクエスト</text><rect class="box" x="252" y="20" width="116" height="52" rx="6"/><text x="310" y="50" class="ink" font-size="12" text-anchor="middle" font-weight="600">接続を作る</text><polyline class="line" points="228,46 252,46"/><polygon class="head" points="252,46 244.6,42.9 244.6,49.1"/><rect class="box" x="392" y="20" width="116" height="52" rx="6"/><text x="450" y="50" class="ink" font-size="12" text-anchor="middle" font-weight="600">問い合わせ</text><polyline class="line" points="368,46 392,46"/><polygon class="head" points="392,46 384.6,42.9 384.6,49.1"/><rect class="box" x="532" y="20" width="116" height="52" rx="6"/><text x="590" y="50" class="ink" font-size="12" text-anchor="middle" font-weight="600">閉じる</text><polyline class="line" points="508,46 532,46"/><polygon class="head" points="532,46 524.6,42.9 524.6,49.1"/><text x="16" y="142" class="ink" font-size="13" text-anchor="start" font-weight="600">reuse</text><text x="16" y="160" class="ink2" font-size="11" text-anchor="start" font-weight="400">Event</text><rect class="ev" x="112" y="120" width="116" height="52" rx="6"/><text x="170" y="150" class="ink" font-size="12" text-anchor="middle" font-weight="600">リクエスト</text><rect class="ev" x="252" y="120" width="116" height="52" rx="6"/><text x="310" y="142" class="ink" font-size="12" text-anchor="middle" font-weight="600">環境の 1 接続</text><text x="310" y="158" class="ink2" font-size="11" text-anchor="middle" font-weight="400">を使う</text><polyline class="line" points="228,146 252,146"/><polygon class="head" points="252,146 244.6,142.9 244.6,149.1"/><rect class="ev" x="392" y="120" width="116" height="52" rx="6"/><text x="450" y="150" class="ink" font-size="12" text-anchor="middle" font-weight="600">問い合わせ</text><polyline class="line" points="368,146 392,146"/><polygon class="head" points="392,146 384.6,142.9 384.6,149.1"/><text x="112" y="192" class="ink2" font-size="11" text-anchor="start" font-weight="400">55 分で張り直す。切れていたら 1 回だけ再接続して再試行</text><text x="16" y="242" class="ink" font-size="13" text-anchor="start" font-weight="600">pool</text><text x="16" y="260" class="ink2" font-size="11" text-anchor="start" font-weight="400">Web</text><rect class="wb" x="112" y="220" width="116" height="52" rx="6"/><text x="170" y="250" class="ink" font-size="12" text-anchor="middle" font-weight="600">リクエスト</text><rect class="wb" x="252" y="220" width="116" height="52" rx="6"/><text x="310" y="242" class="ink" font-size="12" text-anchor="middle" font-weight="600">環境のプールから</text><text x="310" y="258" class="ink2" font-size="11" text-anchor="middle" font-weight="400">借りる</text><polyline class="line" points="228,246 252,246"/><polygon class="head" points="252,246 244.6,242.9 244.6,249.1"/><rect class="wb" x="392" y="220" width="116" height="52" rx="6"/><text x="450" y="250" class="ink" font-size="12" text-anchor="middle" font-weight="600">問い合わせ</text><polyline class="line" points="368,246 392,246"/><polygon class="head" points="392,246 384.6,242.9 384.6,249.1"/><rect class="wb" x="532" y="220" width="116" height="52" rx="6"/><text x="590" y="250" class="ink" font-size="12" text-anchor="middle" font-weight="600">プールに返す</text><polyline class="line" points="508,246 532,246"/><polygon class="head" points="532,246 524.6,242.9 524.6,249.1"/><text x="112" y="292" class="ink2" font-size="11" text-anchor="start" font-weight="400">上限は 10（実際のアプリに近い）または 64（待ちが起きない対照）</text>
</svg>
