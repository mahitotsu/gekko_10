<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 226" width="720" height="226" role="img" aria-labelledby="t d">
<title id="t">軽い読み取りの応答時間の内訳</title><desc id="d">同じ読み取りで、Web は Event より約 7 ms 短い。DB とアプリ内の時間は同じで、差はすべて経路の時間にある。</desc>
<style>
  svg { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .bg { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .grid { stroke: #e6e5e1; stroke-width: 1; } .axis { stroke: #c9c8c3; stroke-width: 1; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; } .s4 { fill: #eda100; } .s5 { fill: #e87ba4; } .onfill { fill: #0b0b0b; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .grid { stroke: #2e2e2c; } .axis { stroke: #4a4a46; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; } .s4 { fill: #c98500; } .s5 { fill: #d55181; }
  }
</style>
<rect class="bg" width="720" height="226"/>
<text x="96" y="22" class="ink2" font-size="12" text-anchor="start" font-weight="400">応答時間の中央値（ms）の内訳</text><rect class="s3" x="96" y="34" width="10" height="10" rx="2"/><text x="112" y="43" class="ink" font-size="12" text-anchor="start" font-weight="400">経路の時間</text><rect class="s4" x="201" y="34" width="10" height="10" rx="2"/><text x="217" y="43" class="ink" font-size="12" text-anchor="start" font-weight="400">アプリ内（DB 以外）</text><rect class="s5" x="384" y="34" width="10" height="10" rx="2"/><text x="400" y="43" class="ink" font-size="12" text-anchor="start" font-weight="400">DB</text><text x="86" y="81" class="ink" font-size="13" text-anchor="end" font-weight="600">Event</text><rect class="s3" x="96" y="64" width="363.6" height="24"/><text x="277.8" y="80" class="onfill" font-size="12" text-anchor="middle" font-weight="600">11.8</text><rect class="s4" x="461.6" y="64" width="1.1" height="24"/><path class="s5" d="M464.7,64 L542.7,64 A4,4 0 0 1 546.7,68 L546.7,84 A4,4 0 0 1 542.7,88 L464.7,88 Z"/><text x="505.7" y="80" class="onfill" font-size="12" text-anchor="middle" font-weight="600">2.7</text><text x="554.7" y="81" class="ink" font-size="12" text-anchor="start" font-weight="600">14.6 ms</text><text x="86" y="137" class="ink" font-size="13" text-anchor="end" font-weight="600">Web</text><rect class="s3" x="96" y="120" width="142.7" height="24"/><text x="167.3" y="136" class="onfill" font-size="12" text-anchor="middle" font-weight="600">4.7</text><rect class="s4" x="240.7" y="120" width="1.1" height="24"/><path class="s5" d="M243.8,120 L318.7,120 A4,4 0 0 1 322.7,124 L322.7,140 A4,4 0 0 1 318.7,144 L243.8,144 Z"/><text x="283.2" y="136" class="onfill" font-size="12" text-anchor="middle" font-weight="600">2.6</text><text x="330.7" y="137" class="ink" font-size="12" text-anchor="start" font-weight="600">7.4 ms</text><line class="axis" x1="96" x2="96" y1="58" y2="164"/><text x="96" y="216" class="ink2" font-size="11" text-anchor="start" font-weight="400">ケース B の item（400 RPS）、2 セットの平均。合計は各部分の中央値の和で、全体の中央値とは少し違う。</text>
</svg>
